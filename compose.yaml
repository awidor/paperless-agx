services:
  paperless-agx:
    build: .
    image: paperless-agx:local
    restart: unless-stopped
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
      - ./config/paperless-agx.docker.toml:/opt/paperless/config/paperless-agx.toml:ro

  # The agent service: indexes documents and answers searches. Paperless reaches it at
  # paperless-agent:3100, and it reads the archive at paperless-agx:3000.
  paperless-agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    image: paperless-agent:local
    restart: unless-stopped
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - ./config/paperless-agent.toml:/opt/agent/config/paperless-agent.toml:ro
