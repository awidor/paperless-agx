data_dir = "data"
listen_addr = "127.0.0.1:3000"
queue_capacity = 16
render_concurrency = 2
eager_thumbnail_pages = 3

[embeddings]
base_url = "https://openrouter.ai/api/v1"
model = "google/gemini-embedding-2"
api_key_env = "OPENROUTER_API_KEY"
max_concurrency = 2

[ocr]
base_url = "http://127.0.0.1:8765/v1"
model = "surya"
profile = "surya"
api_key_env = "OCR_API_KEY"
# Match the two Surya slots in the example llama.cpp router profile.
max_concurrency = 2
pages_per_request = 2
# Surya's own full-page budget and recognition resolution. For Chandra use
# model = "chandra", profile = "chandra", max_output_tokens = 12384 and dpi = 120.
max_output_tokens = 12288
dpi = 192

[llm]
base_url = "https://openrouter.ai/api/v1"
model = "z-ai/glm-5.3-flash"
api_key_env = "OPENROUTER_API_KEY"
max_concurrency = 1
