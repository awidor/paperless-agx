data_dir = "data"
listen_addr = "0.0.0.0:3000"
queue_capacity = 16
render_concurrency = 2
eager_thumbnail_pages = 3

[embeddings]
model_dir = "data/models/harrier-oss-v1-0.6b"
max_concurrency = 1

[ocr]
base_url = "https://openrouter.ai/api/v1"
model = "google/gemini-3.7-flash"
api_key_env = "OPENROUTER_API_KEY"
# The application runs two document jobs, so one hosted OCR request per job is sufficient.
max_concurrency = 2
pages_per_request = 2
# Leave room for dense pages while staying below Gemini's output limit.
max_output_tokens = 32768

[llm]
base_url = "https://openrouter.ai/api/v1"
model = "z-ai/glm-5.3-flash"
api_key_env = "OPENROUTER_API_KEY"
max_concurrency = 1
