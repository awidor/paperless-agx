data_dir = "data"
listen_addr = "127.0.0.1:3000"
queue_capacity = 16
# Also the number of documents indexed at once.
render_concurrency = 2
eager_thumbnail_pages = 3
# Resolution PDF pages are rendered at for the indexing agent and the page viewer.
page_dpi = 150

[embeddings]
base_url = "https://openrouter.ai/api/v1"
model = "google/gemini-embedding-2"
api_key_env = "OPENROUTER_API_KEY"
max_concurrency = 2

# The agent service (agent/): it indexes every document (reads the pages and the document's
# details) and answers searches. It is the only part that talks to a language model.
[agent]
url = "http://127.0.0.1:3100"

# The Samsung SL-M3870FW on the LAN, behind the Scan button (its scan protocol, TCP port 9400).
# Give it a fixed address on the router. Remove this section to hide the button.
[scanner]
host = "192.168.1.218"
