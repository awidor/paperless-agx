data_dir = "data"
listen_addr = "0.0.0.0:3000"
queue_capacity = 16
render_concurrency = 2
eager_thumbnail_pages = 3

[embeddings]
model_dir = "data/models/harrier-oss-v1-0.6b"
max_concurrency = 1

[ocr]
base_url = "http://127.0.0.1:8765/v1"
model = "datalab-to/surya-ocr-2"
api_key_env = "OCR_API_KEY"
# The application runs two document jobs, so one OCR slot per job is sufficient.
max_concurrency = 2
pages_per_request = 2
# The server provides 36,864 tokens per slot; reserve 2,048 for image and prompt.
max_output_tokens = 34816

[llm]
base_url = "https://openrouter.ai/api/v1"
model = "z-ai/glm-5.3-flash"
api_key_env = "OPENROUTER_API_KEY"
max_concurrency = 1
