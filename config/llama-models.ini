version = 1

[*]
cache-type-k = f16
cache-type-v = f16
flash-attn = on
n-gpu-layers = all

# Chandra OCR 2 with multi-token-prediction heads (prithivMLmods/chandra-ocr-2-MTP-Repacked).
[chandra]
model = /models/chandra/chandra-ocr-2-MTP.Q6_K.gguf
mmproj = /models/chandra/chandra-ocr-2.mmproj-f16.gguf
ctx-size = 65536
parallel = 2
spec-type = draft-mtp
spec-draft-n-max = 2
# Halves the vocab-sized compute buffers of the target and MTP draft contexts so the
# vision encoder fits next to them on an 8 GB card.
ubatch-size = 256
reasoning = off
no-webui = true
load-on-startup = true
