version = 1

[*]
cache-type-k = f16
cache-type-v = f16
flash-attn = on
n-gpu-layers = all

# Surya OCR 2.5 (datalab-to/surya-ocr-2.5-gguf, bf16). Block labels and coordinates are
# special tokens, so they only reach Paperless with `special`.
[surya]
model = /models/surya/surya-2.5.gguf
mmproj = /models/surya/surya-2.5-mmproj.gguf
jinja = true
special = true
# 20,480 tokens per slot: a 192 dpi page image (~3,500 tokens for A4, up to ~8,000 for
# large formats), the prompt and the 12,288-token Paperless output limit.
ctx-size = 40960
parallel = 2
reasoning = off
no-webui = true
load-on-startup = true

# Chandra OCR 2 with multi-token-prediction heads (prithivMLmods/chandra-ocr-2-MTP-Repacked).
# Not loaded at startup; set load-on-startup = true and point Paperless at it to switch back.
[chandra]
model = /models/chandra/chandra-ocr-2-MTP.Q6_K.gguf
mmproj = /models/chandra/chandra-ocr-2.mmproj-f16.gguf
# 28,672 tokens per slot: the Paperless output limit plus a 120 dpi page image and the prompt.
ctx-size = 57344
parallel = 2
spec-type = draft-mtp
spec-draft-n-max = 2
# Shrinks the vocab-sized compute buffers of the target and MTP draft contexts so the
# vision encoder fits next to them on an 8 GB card.
ubatch-size = 128
reasoning = off
no-webui = true
load-on-startup = false
