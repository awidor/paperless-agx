data_dir = "/data"
listen_addr = "0.0.0.0:3000"
queue_capacity = 16
render_concurrency = 2
eager_thumbnail_pages = 3

[embeddings]
model_dir = "/opt/paperless/models/harrier-oss-v1-0.6b"
max_concurrency = 1

[ocr]
base_url = "http://127.0.0.1:8765/v1"
model = "datalab-to/surya-ocr-2"
api_key_env = "OCR_API_KEY"
# One request per page, so this is how many llama.cpp slots we keep busy;
# decode is memory-bound, so 6 concurrent pages run ~3x the tokens/s of one.
max_concurrency = 6
pages_per_request = 6
# Leave roughly 2,000 per-slot context tokens for the image and prompt.
max_output_tokens = 16384

[llm]
base_url = "https://openrouter.ai/api/v1"
model = "z-ai/glm-5.3-flash"
api_key_env = "OPENROUTER_API_KEY"
max_concurrency = 1
