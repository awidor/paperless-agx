data_dir = "/data"
listen_addr = "0.0.0.0:3000"
queue_capacity = 16
render_concurrency = 2
eager_thumbnail_pages = 3

[embeddings]
base_url = "http://host.docker.internal:8765/v1"
model = "harrier"
api_key_env = "OCR_API_KEY"
max_concurrency = 1

[ocr]
base_url = "http://host.docker.internal:8765/v1"
model = "chandra"
api_key_env = "OCR_API_KEY"
# Match the two Chandra slots in the example llama.cpp router profile.
max_concurrency = 2
pages_per_request = 2
max_output_tokens = 24576

[llm]
base_url = "https://openrouter.ai/api/v1"
model = "z-ai/glm-5.3-flash"
api_key_env = "OPENROUTER_API_KEY"
max_concurrency = 1
