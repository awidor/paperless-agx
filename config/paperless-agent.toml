listen = "0.0.0.0:3100"
# Paperless AGX, which serves the archive the agent's tools read.
paperless_url = "http://paperless-agx:3000"

[model]
# An OpenRouter model from Pi's catalog, with its reasoning effort.
id = "anthropic/claude-haiku-5.5"
reasoning = "medium"
api_key_env = "OPENROUTER_API_KEY"
# OpenRouter providers to route to. Requests also require zero data retention.
providers = ["google-vertex", "amazon-bedrock"]

[limits]
# Model turns per search; the last one may only submit results.
max_turns = 8
timeout_seconds = 90
max_results = 10
