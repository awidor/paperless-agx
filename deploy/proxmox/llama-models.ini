version = 1

[*]
cache-type-k = f16
cache-type-v = f16
flash-attn = on
n-gpu-layers = all

[chandra]
model = /models/chandra/chandra-ocr-2.Q6_K.gguf
mmproj = /models/chandra/chandra-ocr-2.mmproj-f16.gguf
ctx-size = 65536
parallel = 2
reasoning = off
no-webui = true
load-on-startup = true

[harrier]
model = /models/harrier-oss-v1-0.6b-f16.gguf
embedding = true
pooling = last
embd-normalize = 2
n-gpu-layers = 0
ctx-size = 32768
parallel = 2
no-webui = true
load-on-startup = true
