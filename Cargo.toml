[workspace]
members = [
    "crates/models",
    "crates/storage",
    "crates/embeddings",
    "crates/search",
    "crates/ocr-client",
    "crates/ingest",
    "crates/server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.6", features = ["http1", "json", "multipart", "tokio"] }
base64 = "0.22.1"
blake3 = "1.8.2"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.53", features = ["derive", "env"] }
dotenvy = "0.15.7"
futures = "0.3.31"
html2md = "0.2.17"
html5ever = "0.39.0"
markup5ever_rcdom = "0.39.0"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
infer = "0.19.0"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.17", features = ["io"] }
toml = "0.9.8"
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["catch-panic", "fs", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = { version = "2.5.7", features = ["serde"] }
